<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manhwa PT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#f5f5f7;font-family:Arial,sans-serif}
header{padding:22px;background:#191923;border-bottom:1px solid #343444}
h1{margin:0;color:#a78bfa}
main{max-width:760px;margin:35px auto;padding:20px}
p{color:#b8b8c8;line-height:1.6}
input,button{width:100%;padding:15px;margin-top:12px;border-radius:10px;font-size:16px}
input{background:#20202c;color:white;border:1px solid #49495b}
button{background:#8b5cf6;color:white;border:0;font-weight:bold}
#status{margin-top:20px;overflow-wrap:anywhere}
footer{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<header><h1>📖 Manhwa PT</h1><p>Seu leitor de manhwa em português.</p></header>
<main>
<h2>Traduzir capítulo</h2>
<p>Cola o link do capítulo para começar.</p>
<input id="url" type="url" placeholder="https://site.com/capitulo-1">
<button onclick="abrir()">Abrir capítulo</button>
<div id="status"></div>
</main>
<footer>Manhwa PT · Projeto em desenvolvimento</footer>
<script>
function abrir(){
const url=document.getElementById('url').value.trim();
const status=document.getElementById('status');
if(!url){status.textContent='Cola o link do capítulo primeiro.';return;}
try{
const u=new URL(url);
if(u.protocol!=='https:'&&u.protocol!=='http:')throw Error();
status.innerHTML='';
const p=document.createElement('p');
p.textContent='Link recebido. Este protótipo ainda não possui o motor de tradução conectado.';
status.appendChild(p);
const a=document.createElement('a');
a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';
a.textContent='Abrir capítulo original';
a.style.color='#c4b5fd';
status.appendChild(a);
}catch(e){status.textContent='Link inválido. Cola um endereço completo.';}
}
</script>
</body>
</html>
